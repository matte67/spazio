<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 510" role="img" aria-labelledby="title desc">
  <title id="title">Imposta Spazio come schermata Home predefinita</title>
  <desc id="desc">Avvia Spazio, premi Home e scegli Spazio sempre, oppure selezionalo nelle impostazioni delle app predefinite. Infine verifica il tasto Home da un’altra app.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#667780"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #19272d; }
      .title { font-size: 27px; font-weight: 700; letter-spacing: -.4px; }
      .heading { font-size: 17px; font-weight: 650; }
      .body { font-size: 14px; fill: #4b5d65; }
      .tag { font-size: 12px; font-weight: 700; letter-spacing: .6px; }
      .card { fill: #fff; stroke: #d8e1e2; stroke-width: 1.5; }
      .line { fill: none; stroke: #7c8d93; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1040" height="510" rx="24" fill="#f3f7f6"/>
  <text x="48" y="57" class="title">Imposta Spazio come Home principale</text>

  <rect x="365" y="90" width="310" height="74" rx="15" fill="#e7f2ed" stroke="#c2ddd1" stroke-width="1.5"/>
  <text x="520" y="120" text-anchor="middle" class="heading">1 · Avvia Spazio</text>
  <text x="520" y="143" text-anchor="middle" class="body">Poi premi Home sul telecomando.</text>
  <path d="M520 164v34M520 198H270v24M520 198h250v24" class="line"/>

  <rect x="70" y="230" width="400" height="140" rx="17" class="card"/>
  <text x="98" y="269" class="tag" fill="#18876a">SE COMPARE IL SELETTORE</text>
  <text x="98" y="304" class="heading">2 · Scegli Spazio</text>
  <text x="98" y="333" class="body">Seleziona “Sempre” per ricordare la scelta.</text>

  <rect x="570" y="230" width="400" height="140" rx="17" class="card"/>
  <text x="598" y="269" class="tag" fill="#486ad5">SE NON COMPARE</text>
  <text x="598" y="304" class="heading">2 · Apri le app predefinite</text>
  <text x="598" y="333" class="body">Impostazioni → App → App Home → Spazio.</text>

  <path d="M270 370v34h250M770 370v34H520" class="line"/>
  <rect x="210" y="416" width="620" height="64" rx="15" fill="#19272d"/>
  <text x="520" y="443" text-anchor="middle" font-size="17" font-weight="650" fill="#fff">3 · Premi Home da un’altra app per verificare</text>
  <text x="520" y="464" text-anchor="middle" font-size="13" fill="#c6d2d1">Se si apre Spazio, è configurato come launcher predefinito.</text>
</svg>
