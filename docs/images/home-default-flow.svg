<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-labelledby="title description">
  <title id="title">Imposta Spazio come schermata Home predefinita</title>
  <desc id="description">Avvia Spazio e premi Home. Selezionalo nel selettore oppure nelle impostazioni delle app predefinite. Verifica la scelta tornando alla Home da un’altra app.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #19272d; }
      .title { font-size: 29px; font-weight: 700; letter-spacing: -.4px; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .8px; }
      .heading { font-size: 19px; font-weight: 650; }
      .body { font-size: 15px; fill: #40525a; }
      .small { font-size: 13px; fill: #52636b; }
      .green { fill: #17785f; }
      .blue { fill: #4058a7; }
      .number { fill: #fff; }
      .card { fill: #fff; stroke: #d8e1e2; stroke-width: 1.5; }
      .connector { fill: none; stroke: #a9b9b9; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1080" height="500" rx="24" fill="#f4f7f6"/>
  <text x="52" y="60" class="title">Scegli Spazio come schermata Home</text>

  <rect x="330" y="91" width="420" height="88" rx="18" fill="#e8f3ee" stroke="#c9e1d6" stroke-width="1.5"/>
  <circle cx="373" cy="135" r="21" fill="#17785f"/>
  <text x="373" y="141" class="number" text-anchor="middle" font-size="16" font-weight="700">1</text>
  <text x="412" y="129" class="heading">Avvia Spazio</text>
  <text x="412" y="153" class="body">Poi premi il tasto Home sul telecomando.</text>

  <text x="52" y="222" class="eyebrow">2 · USA IL PERCORSO DISPONIBILE SULLA TUA TV</text>
  <path d="M540 179v23M300 202h480M300 202v18M780 202v18" class="connector"/>
  <circle cx="300" cy="202" r="4" fill="#829694"/>
  <circle cx="780" cy="202" r="4" fill="#829694"/>

  <rect x="52" y="238" width="468" height="138" rx="18" class="card"/>
  <rect x="52" y="238" width="7" height="138" rx="3.5" fill="#17785f"/>
  <text x="82" y="272" class="eyebrow green">SE VEDI IL SELETTORE</text>
  <text x="82" y="309" class="heading">Seleziona Spazio</text>
  <text x="82" y="341" class="body">Conferma “Sempre” per ricordare la scelta.</text>

  <rect x="560" y="238" width="468" height="138" rx="18" class="card"/>
  <rect x="560" y="238" width="7" height="138" rx="3.5" fill="#4864bf"/>
  <text x="590" y="272" class="eyebrow blue">SE NON VEDI IL SELETTORE</text>
  <text x="590" y="309" class="heading">Scegli dalle impostazioni</text>
  <text x="590" y="341" class="body">App predefinite → App Home → Spazio.</text>

  <path d="M286 376v25h254M794 376v25H540v0" class="connector"/>
  <circle cx="286" cy="401" r="4" fill="#829694"/>
  <circle cx="794" cy="401" r="4" fill="#829694"/>
  <rect x="146" y="421" width="788" height="58" rx="17" fill="#e8f3ee" stroke="#c9e1d6" stroke-width="1.5"/>
  <circle cx="188" cy="450" r="20" fill="#17785f"/>
  <text x="188" y="456" class="number" text-anchor="middle" font-size="16" font-weight="700">3</text>
  <text x="228" y="447" class="heading">Prova il tasto Home da un’altra app</text>
  <text x="228" y="466" class="small">Se si apre Spazio, è impostato correttamente.</text>
</svg>
