<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" role="img" aria-labelledby="title description">
  <title id="title">Installazione di Spazio su una TV Android</title>
  <desc id="description">Verifica che la TV abbia Android TV o Google TV 11 o successivo, installa Spazio con chiavetta USB oppure tramite ADB, poi impostalo come Home.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #19272d; }
      .title { font-size: 30px; font-weight: 700; letter-spacing: -.45px; }
      .subtitle { font-size: 16px; fill: #52636b; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .8px; }
      .heading { font-size: 20px; font-weight: 650; }
      .body { font-size: 15px; fill: #40525a; }
      .small { font-size: 13px; fill: #52636b; }
      .green { fill: #17785f; }
      .blue { fill: #4058a7; }
      .number { fill: #fff; }
      .card { fill: #fff; stroke: #d8e1e2; stroke-width: 1.5; }
      .connector { fill: none; stroke: #a9b9b9; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1080" height="610" rx="24" fill="#f4f7f6"/>
  <text x="52" y="56" class="title">Installa Spazio sulla tua TV</text>
  <text x="52" y="84" class="subtitle">Tre passaggi semplici. Scegli il metodo che preferisci.</text>

  <rect x="52" y="112" width="976" height="104" rx="18" fill="#e8f3ee" stroke="#c9e1d6" stroke-width="1.5"/>
  <circle cx="91" cy="164" r="21" fill="#17785f"/>
  <text x="91" y="170" class="number" text-anchor="middle" font-size="16" font-weight="700">1</text>
  <text x="128" y="157" class="eyebrow green">PRIMA DI INIZIARE</text>
  <text x="128" y="184" class="heading">Verifica il modello della TV</text>
  <text x="486" y="158" class="body">Serve Android TV o Google TV</text>
  <text x="486" y="183" class="body">con Android 11 o successivo.</text>

  <text x="52" y="251" class="eyebrow" fill="#52636b">2 · SCEGLI UN METODO</text>
  <path d="M540 216v24M292 240h496M292 240v20M788 240v20" class="connector"/>
  <circle cx="292" cy="240" r="4" fill="#829694"/>
  <circle cx="788" cy="240" r="4" fill="#829694"/>

  <rect x="52" y="268" width="468" height="190" rx="18" class="card"/>
  <rect x="52" y="268" width="7" height="190" rx="3.5" fill="#17785f"/>
  <text x="82" y="302" class="eyebrow" fill="#17785f">A · PIÙ SEMPLICE</text>
  <text x="82" y="335" class="heading">Chiavetta USB</text>
  <text x="82" y="371" class="body">1. Copia Spazio.apk sulla chiavetta.</text>
  <text x="82" y="400" class="body">2. Apri il file sulla TV e installalo.</text>
  <rect x="82" y="418" width="190" height="25" rx="12.5" fill="#e8f3ee"/>
  <text x="177" y="435" text-anchor="middle" class="eyebrow green">NESSUN DEBUG NECESSARIO</text>

  <rect x="560" y="268" width="468" height="190" rx="18" class="card"/>
  <rect x="560" y="268" width="7" height="190" rx="3.5" fill="#4864bf"/>
  <text x="590" y="302" class="eyebrow blue">B · DA COMPUTER</text>
  <text x="590" y="335" class="heading">Installazione ADB</text>
  <text x="590" y="371" class="body">1. Attiva Opzioni sviluppatore e debug.</text>
  <text x="590" y="400" class="body">2. Collega la TV e installa con ADB.</text>
  <rect x="590" y="418" width="176" height="25" rx="12.5" fill="#edf0fb"/>
  <text x="678" y="435" text-anchor="middle" class="eyebrow blue">RICHIEDE ADB</text>

  <path d="M286 458v25h254M794 458v25H540v0" class="connector"/>
  <circle cx="286" cy="483" r="4" fill="#829694"/>
  <circle cx="794" cy="483" r="4" fill="#829694"/>
  <rect x="146" y="504" width="788" height="76" rx="18" fill="#e8f3ee" stroke="#c9e1d6" stroke-width="1.5"/>
  <circle cx="188" cy="542" r="21" fill="#17785f"/>
  <text x="188" y="548" class="number" text-anchor="middle" font-size="16" font-weight="700">3</text>
  <text x="228" y="538" class="heading">Imposta Spazio come Home</text>
  <text x="228" y="560" class="small">Premi Home sul telecomando, scegli Spazio e conferma “Sempre”.</text>
</svg>
